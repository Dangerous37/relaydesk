name: RelayDesk checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm ci --offline
      - run: npm test
      - run: npm run demo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lab.txt
      - run: python -m playwright install --with-deps chrome
      - run: python lab_test.py
